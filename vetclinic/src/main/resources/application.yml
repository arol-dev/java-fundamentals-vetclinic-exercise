server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:vetclinicdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0 emite los tokens con este issuer
          issuer-uri: https://${auth0.domain}/

auth0:
  audience: https://vetclinic-api
  domain: alcuavi.eu.auth0.com